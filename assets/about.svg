<g clip-path="url(#cp)"><rect width="1000" height="284" fill="#0d1117"/><g filter="url(#bl)" opacity=".17"><circle cx="90" cy="50" r="110" fill="#58a6ff"><animate attributeName="cx" values="90;230;90" dur="16s" repeatCount="indefinite"/></circle><circle cx="910" cy="254" r="120" fill="#a78bfa"><animate attributeName="cx" values="910;750;910" dur="19s" repeatCount="indefinite"/></circle><circle cx="500" cy="304" r="90" fill="#f472b6" opacity=".8"><animate attributeName="cx" values="500;660;500" dur="14s" repeatCount="indefinite"/></circle></g><rect width="1000" height="85" fill="url(#hl)"/><text x="44" y="64" font-size="26" font-weight="800" fill="url(#tt)">Building things that work end to end.</text><text x="44" y="110" font-size="15" fill="#e6edf3" fill-opacity=".9">I'm a final-year B.Tech Computer Science &amp; Engineering student at MIT World Peace</text><text x="44" y="138" font-size="15" fill="#e6edf3" fill-opacity=".9">University, Pune. I build full-stack apps with Java, Spring Boot, React and Angular</text><text x="44" y="166" font-size="15" fill="#e6edf3" fill-opacity=".9">on top of MySQL, and I'm growing my AI / ML toolkit with Python, TensorFlow, Keras</text><text x="44" y="194" font-size="15" fill="#e6edf3" fill-opacity=".9">and scikit-learn. Right now I'm a Software Development Intern at Bluescope IT.</text><g transform="translate(44 224)"><rect width="120" height="34" rx="17" fill="#111722" stroke="#58a6ff" stroke-opacity=".6"/><text x="60.0" y="21" font-size="13" font-weight="700" fill="#58a6ff" text-anchor="middle">Full-Stack</text></g><g transform="translate(176 224)"><rect width="128" height="34" rx="17" fill="#111722" stroke="#4ade80" stroke-opacity=".6"/><text x="64.0" y="21" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">Spring Boot</text></g><g transform="translate(316 224)"><rect width="94" height="34" rx="17" fill="#111722" stroke="#f472b6" stroke-opacity=".6"/><text x="47.0" y="21" font-size="13" font-weight="700" fill="#f472b6" text-anchor="middle">AI / ML</text></g><g transform="translate(422 224)"><rect width="162" height="34" rx="17" fill="#111722" stroke="#a78bfa" stroke-opacity=".6"/><text x="81.0" y="21" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">Graduating 2027</text></g><rect x="-110" y="-10" width="80" height="304" fill="url(#sw)" transform="skewX(-20)"><animateTransform attributeName="transform" type="translate" additive="sum" values="-110 0;1240 0;1240 0" keyTimes="0;.4;1" dur="10s" begin="2s" repeatCount="indefinite"/></rect></g><rect x="1" y="1" width="998" height="282" rx="19" fill="none" stroke="url(#fr)" stroke-width="1.6"/></svg>